[project]
name = "japanese-rag"
version = "0.1.0"
description = "GraphRAG for Japanese language learning"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "uvicorn[standard]>=0.32.0",

  "chromadb>=0.5.0",
  "neo4j>=5.25.0",

  "sentence-transformers>=3.2.0",

  "groq>=0.11.0",

  "fugashi[unidic-lite]>=1.4.0",

  "httpx>=0.27.0",
  "loguru>=0.7.2",
  "python-dotenv>=1.0.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM"]
